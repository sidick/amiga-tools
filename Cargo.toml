[workspace]
resolver = "2"
members = ["tools/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Simon Dick <simond@irrelevant.org>"]
repository = "https://github.com/sidick/amiga-tools"

[workspace.dependencies]
amiga-ffs = "0.4"
amiga-rdb = "0.4"
amiga-rom = "0.4"

# Until the next amiga-rdb release: pick up post-0.4.1 API added for
# these tools (lseg_blocks, load_filesystem_exact, set_patch_flags,
# remap_geometry, envec accessors). Drop when crates.io catches up.
[patch.crates-io]
amiga-rdb = { git = "https://github.com/sidick/amiga-rdb-rs" }
